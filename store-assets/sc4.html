<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1080px;height:1920px;overflow:hidden;}
body{
  background:linear-gradient(150deg,#2e1065 0%,#5b21b6 30%,#7c3aed 58%,#4f46e5 100%);
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  position:relative;
}
.c1{position:absolute;width:900px;height:900px;border-radius:50%;background:rgba(255,255,255,0.04);top:-280px;right:-240px;}
.c2{position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,255,255,0.04);bottom:450px;left:-160px;}

.top{padding:100px 88px 44px;position:relative;z-index:2;}
.chip{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:100px;padding:14px 34px;color:white;font-size:29px;font-weight:600;margin-bottom:48px;}
h1{font-size:108px;font-weight:900;color:white;line-height:1.06;letter-spacing:-0.045em;margin-bottom:32px;word-break:keep-all;}
h1 em{font-style:normal;color:#ddd6fe;}
.desc{font-size:35px;color:rgba(255,255,255,0.75);line-height:1.65;letter-spacing:-0.01em;word-break:keep-all;}

.features{margin-top:44px;display:flex;flex-direction:column;gap:16px;}
.feat{display:flex;align-items:center;gap:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);border-radius:18px;padding:22px 28px;}
.feat-icon{font-size:36px;flex-shrink:0;}
.feat-title{font-size:27px;font-weight:700;color:white;letter-spacing:-0.02em;}
.feat-sub{font-size:21px;color:rgba(255,255,255,0.65);margin-top:4px;}

.phone-wrap{display:flex;justify-content:center;padding-top:40px;position:relative;z-index:2;}
.phone{width:640px;height:1022px;background:#0a0a0b;border-radius:68px;overflow:hidden;box-shadow:0 70px 140px -20px rgba(0,0,0,0.75),0 0 0 1.5px rgba(255,255,255,0.1);display:flex;flex-direction:column;}
.sbar{height:52px;flex-shrink:0;background:#141416;display:flex;align-items:center;justify-content:space-between;padding:0 32px;}
.sbar-t{color:white;font-size:22px;font-weight:700;}
.sbar-r{color:rgba(255,255,255,0.65);font-size:18px;}

.tbar{background:#141416;padding:16px 22px 13px;border-bottom:1px solid #27272a;flex-shrink:0;}
.tbar-title{font-size:22px;font-weight:700;color:#fafafa;letter-spacing:-0.02em;}
.tbar-sub{font-size:15px;color:#71717a;margin-top:3px;}

.content{flex:1;overflow:hidden;background:#0a0a0b;padding:16px 18px;}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-title{font-size:13px;font-weight:700;color:#a1a1aa;letter-spacing:0.06em;text-transform:uppercase;}
.sec-count{font-size:12px;color:#52525b;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.site-item{background:#141416;border:1px solid #27272a;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.site-left{display:flex;align-items:center;gap:8px;}
.dot-color{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.site-name{font-size:16px;font-weight:600;color:#e4e4e7;}
.check{width:20px;height:20px;border-radius:50%;border:2px solid #3f3f46;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check.on{background:#4f46e5;border-color:#4f46e5;}
.check.on::after{content:'✓';color:white;font-size:11px;font-weight:700;}

.apply-bar{background:#141416;border:1px solid #27272a;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.apply-count{font-size:17px;font-weight:600;color:#e4e4e7;}
.apply-btn{background:#4f46e5;color:white;border-radius:9px;padding:10px 22px;font-size:16px;font-weight:600;}
</style>
</head>
<body>
<div class="c1"></div><div class="c2"></div>
<div class="top">
  <div class="chip">✨ 맞춤 피드</div>
  <h1>내가 원하는<br><em>커뮤니티만</em></h1>
  <p class="desc">22개 중 원하는 사이트만 골라<br>나만의 맞춤 피드를 만들어보세요</p>
  <div class="features">
    <div class="feat"><span class="feat-icon">🎯</span><div><div class="feat-title">취향별 선택</div><div class="feat-sub">커뮤니티 · 핫딜 · 영화 · 게임</div></div></div>
    <div class="feat"><span class="feat-icon">💾</span><div><div class="feat-title">설정 자동 저장</div><div class="feat-sub">앱을 껐다 켜도 내 선택 유지</div></div></div>
    <div class="feat"><span class="feat-icon">⚡</span><div><div class="feat-title">선택한 곳만 로드</div><div class="feat-sub">더 빠르고 가볍게</div></div></div>
  </div>
</div>
<div class="phone-wrap"><div class="phone">
  <div class="sbar"><span class="sbar-t">9:41</span><span class="sbar-r">●●● WiFi 100%</span></div>
  <div class="tbar">
    <div class="tbar-title">커뮤니티 구독 설정</div>
    <div class="tbar-sub">원하는 커뮤니티를 선택하세요</div>
  </div>
  <div class="content">
    <div class="sec-header">
      <span class="sec-title">커뮤니티</span>
      <span class="sec-count">13개</span>
    </div>
    <div class="grid">
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#475569"></div><span class="site-name">클리앙</span></div><div class="check on"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#d6006c"></div><span class="site-name">더쿠</span></div><div class="check on"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#d1410c"></div><span class="site-name">디시인사이드</span></div><div class="check on"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#c81e1e"></div><span class="site-name">루리웹</span></div><div class="check"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#0b3b5c"></div><span class="site-name">엠팍</span></div><div class="check"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#c92b2b"></div><span class="site-name">네이트판</span></div><div class="check on"></div></div>
    </div>
    <div class="sec-header" style="margin-top:4px;">
      <span class="sec-title">핫딜</span>
      <span class="sec-count">3개</span>
    </div>
    <div class="grid">
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#a16207"></div><span class="site-name">뽐뿌</span></div><div class="check on"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#c2410c"></div><span class="site-name">쿼사존</span></div><div class="check on"></div></div>
      <div class="site-item"><div class="site-left"><div class="dot-color" style="background:#854d0e"></div><span class="site-name">딜바다</span></div><div class="check"></div></div>
    </div>
    <div class="apply-bar">
      <span class="apply-count">5개 선택됨</span>
      <div class="apply-btn">적용하기</div>
    </div>
  </div>
</div></div>
</body>
</html>
