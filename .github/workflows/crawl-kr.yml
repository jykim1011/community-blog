name: Auto Crawl (KR)

# 한국 IP(셀프호스티드 러너, 라벨 korea)에서 크롤링한다.
# 뽐뿌·오늘의유머·퀘이사존·익스트림무비 등은 GitHub 서버(해외 데이터센터 IP)를 403 으로 차단한다.
# 러너 PC 가 꺼져 있으면 이 잡은 대기만 하고, crawl.yml(ubuntu)이 대신 크롤링한다.
# 셀프호스티드 러너가 붙은 공개 저장소이므로 pull_request 트리거를 절대 추가하지 말 것.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: crawl-kr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: [self-hosted, korea]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      # Windows 러너: PATH 에서 WSL bash(System32) 보다 Git Bash 가 먼저 잡히게 한다
      - name: Use Git Bash
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run crawler
        env:
          TZ: Asia/Seoul
        run: npx tsx scripts/crawl.ts

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            # "(kr)" 표시는 crawl.yml 이 한국 IP 크롤링이 살아있는지 판단하는 데 쓴다
            git commit -m "chore: update crawled data (kr) [skip ci]"
            git pull --rebase -X theirs origin master
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build static site
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out/ --project-name community-blog --commit-dirty=true
