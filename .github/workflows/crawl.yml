name: Auto Crawl

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 30

      # 한국 IP 러너(crawl-kr.yml)가 최근에 크롤링했으면 건너뛴다. 러너 PC 가 꺼져 있을 때만 여기서 크롤링.
      - name: Check KR crawler
        id: kr
        run: |
          recent=$(git log --since="50 minutes ago" --grep="(kr)" --format=%H -1)
          if [ -n "$recent" ]; then
            echo "한국 IP 크롤러가 최근 실행됨 ($recent) — 건너뜀"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v7
        if: steps.kr.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        if: steps.kr.outputs.skip != 'true'

      - name: Run crawler
        if: steps.kr.outputs.skip != 'true'
        env:
          TZ: Asia/Seoul
          # GitHub 서버 IP 를 403 으로 막는 사이트 — 한국 IP 러너(crawl-kr.yml)만 수집한다
          CRAWL_SKIP: ppomppu,todayhumor,extmovie
        run: npx tsx scripts/crawl.ts

      - name: Commit and push
        id: commit
        if: steps.kr.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update crawled data [skip ci]"
            git pull --rebase -X theirs origin master
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Build static site
        if: steps.commit.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out/ --project-name community-blog --commit-dirty=true

      # GitHub cron 은 crawl-kr.yml 을 4~5시간에 한 번꼴로만 띄운다. 이 체인(30분 간격)에 태워 보낸다.
      # 러너 PC 가 꺼져 있으면 대기열에 남고, concurrency 로 대기 중인 건 최신 1건만 유지된다.
      - name: Trigger KR crawler
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
        run: gh workflow run crawl-kr.yml --repo ${{ github.repository }} --ref master || true

      - name: Trigger next crawl cycle (28min later)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
        run: gh workflow run crawl-trigger.yml --repo ${{ github.repository }} --ref master || true
